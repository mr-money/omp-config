providers:
  webSearchOrder:
    []
modelRoles:
  plan: volcengine-coding/glm-5.3:high
  slow: volcengine-coding/glm-5.3:high
  advisor: volcengine-coding/doubao-seed-evolving:medium
  commit: volcengine-coding/doubao-seed-2.0-mini:off
  smol: volcengine-coding/deepseek-v4-1-flash-260910:auto
  default: volcengine-coding/glm-5-3-flash
  tiny: volcengine-coding/doubao-seed-2.0-mini:off
  vision: volcengine-coding/glm-5-3-flash:auto
  DeepSeek: deepseek/deepseek-flash:auto
  task: volcengine-coding/glm-5-3-flash:auto
  agent-plan: agent-plan/deepseek-v4.1-flash:high
defaultThinkingLevel: auto
memory:
  backend: mnemopi
mnemopi:
  scoping: per-project-tagged
  embeddingVariant: multilingual
  recallLimit: 10
hideThinkingBlock: true
cycleOrder:
  - smol
  - default
  - slow
  - agent-plan
statusLine:
  preset: custom
  leftSegments:
    - pi
    - vim
    - model
    - mode
    - collab
    - path
    - git
    - pr
    - context_pct
  rightSegments:
    - session_name
  separator: powerline-thin
  segmentOptions:
    git:
      showBranch: true
      showStaged: false
      showUnstaged: false
      showUntracked: false
    path:
      abbreviate: true
      maxLength: 40
      stripWorkPrefix: true
    model:
      showThinkingLevel: true
composer:
  shape: box
dev:
  autoqaConsent: granted
theme:
  dark: titanium
