modelRoles:
  plan: commandcode/gpt-6.1-sol:auto
  slow: commandcode/claude-sonnet-5-5:auto
  advisor: volcengine-coding/doubao-seed-evolving:medium
  commit: commandcode/inclusionai/ling-3.1-flash:free:auto
  smol: commandcode/gpt-6.1-sol:auto
  default: commandcode/gpt-6-luna
  tiny: commandcode/inclusionai/ling-3.1-flash:free:auto
  vision: commandcode/z-ai/glm-5.3-flash:high
  DeepSeek: deepseek/deepseek-flash:auto
  task: volcengine-coding/glm-5-3-flash:auto
  agent-plan: agent-plan/deepseek-v4.1-flash:high
defaultThinkingLevel: auto
memory:
  backend: mnemopi
mnemopi:
  scoping: per-project-tagged
  embeddingVariant: multilingual
  recallLimit: 10
hideThinkingBlock: true
cycleOrder:
  - smol
  - default
  - slow
  - agent-plan
statusLine:
  preset: custom
  leftSegments:
    - pi
    - vim
    - model
    - mode
    - collab
    - path
    - git
    - pr
    - context_pct
  rightSegments:
    - session_name
  separator: powerline-thin
  segmentOptions:
    git:
      showBranch: true
      showStaged: false
      showUnstaged: false
      showUntracked: false
    path:
      abbreviate: true
      maxLength: 40
      stripWorkPrefix: true
    model:
      showThinkingLevel: true
composer:
  shape: box
dev:
  autoqaConsent: granted
theme:
  dark: titanium
extendedContext: true
images:
  describeForTextModels: true