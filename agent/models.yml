  agent-plan:
    baseUrl: https://ark.cn-beijing.volces.com/api/plan/v3
    api: openai-completions
    apiKey: <ARK_API_KEY>  # 替换为 Agent Plan API Key
    authHeader: true
    models:
      - id: deepseek-v4.1-flash
        name: DeepSeek V4.1 Flash (Agent Plan)
        input: [text, image]
        contextWindow: 1048576
        maxTokens: 393216
        reasoning: true
        compat:
          supportsDeveloperRole: false
          maxTokensField: max_tokens
      - id: glm-5-3-flash
        name: GLM 5.3 Flash (Agent Plan)
        input: [text, image]
        contextWindow: 1024000
        maxTokens: 65536
        compat:
          supportsDeveloperRole: false
          maxTokensField: max_tokens
      - id: glm-5.3
        name: GLM-5.3(Agent Plan)
        input: [text]
        contextWindow: 1024000
        maxTokens: 65536
        compat:
          supportsDeveloperRole: false
          maxTokensField: max_tokens
  deepseek:
    modelOverrides:
      deepseek-flash:
        cost:
          input: 2.0
          output: 8.0
          cacheRead: 0.04
          cacheWrite: 2.0
      deepseek-v4-flash:
        cost:
          input: 2.0
          output: 8.0
          cacheRead: 0.04
          cacheWrite: 2.0
      deepseek-v4-flash-vision-exp:
        cost:
          input: 2.0
          output: 8.0
          cacheRead: 0.04
          cacheWrite: 2.0
      deepseek-v4-pro:
        cost:
          input: 9.0
          output: 27.0
          cacheRead: 0.3
          cacheWrite: 9.0
  zhipu:
    baseUrl: https://open.bigmodel.cn/api/paas/v4
    api: openai-completions
    apiKey: <ZHIPU_API_KEY>  # 替换为智谱 GLM API Key
    authHeader: true
    models:
      - id: glm-5.3-flash
        name: GLM 5.3 Flash
        input: [text, image]
        contextWindow: 1048576
        maxTokens: 131072
        reasoning: true
        cost:
          input: 0.8
          output: 2.8
          cacheRead: 0.23
          cacheWrite: 0.8
        compat:
          supportsDeveloperRole: false
          maxTokensField: max_tokens

  commandcode:
    # omp 内置 commandcode 目录把全部模型声明为 input:[text]（omp models 显示 images=no），
    # 以下为实测（随机 token 探针图 ×2~4 次，能读出图中文字即判为支持）确认支持图片的模型。
    # openai-completions 线必须同时声明 input 与 compat.stripImageInput:false；
    # 否则 omp 的能力判定 _Te() 仍返回 false，图片会被摘除。
    modelOverrides:
      "inclusionai/ling-3.1-flash:free":
        contextWindow: 262144
        maxTokens: 32768
      # --- 以下 36 个模型实测支持视觉 ---
      "MiniMaxAI/MiniMax-M3":
        input: [text, image]
        compat:
          stripImageInput: false
