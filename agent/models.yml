providers:
  volcengine-coding:
    baseUrl: https://ark.cn-beijing.volces.com/api/coding/v3
    api: openai-completions
    apiKey: "<VOLCENGINE_CODING_API_KEY>"
    authHeader: true
    models:
      - id: deepseek-v4-1-flash-26101
        name: DeepSeek V4.1 Flash(ark)
        input:
          - text
          - image
        contextWindow: 1024000
        maxTokens: 65536
        compat:
          supportsDeveloperRole: false
          maxTokensField: max_tokens
  agent-plan:
    baseUrl: https://ark.cn-beijing.volces.com/api/plan/v3
    api: openai-completions
    apiKey: "<ARK_API_KEY>"
    authHeader: true
    models:
      - id: deepseek-v4.1-flash
        name: DeepSeek V4.1 Flash (Agent Plan)
        input:
          - text
          - image
        contextWindow: 1048576
        maxTokens: 393216
        reasoning: true
        compat:
          supportsDeveloperRole: false
          maxTokensField: max_tokens
      - id: glm-5-3-flash
        name: GLM 5.3 Flash (Agent Plan)
        input:
          - text
          - image
        contextWindow: 1024000
        maxTokens: 65536
        compat:
          supportsDeveloperRole: false
          maxTokensField: max_tokens
      - id: glm-5.3
