        input:
          - text
        contextWindow: 1024000
        maxTokens: 65536
        compat:
          supportsDeveloperRole: false
          maxTokensField: max_tokens
  zhipu:
    baseUrl: https://open.bigmodel.cn/api/paas/v4
    api: openai-completions
    apiKey: "<ZHIPU_API_KEY>"
    authHeader: true
    models:
      - id: glm-5.3-flash
        name: GLM 5.3 Flash
        input:
          - text
          - image
        contextWindow: 1048576
        maxTokens: 131072
        reasoning: true
        cost:
          input: 0.8
          output: 2.8
          cacheRead: 0.23
          cacheWrite: 0.8
        compat:
          supportsDeveloperRole: false
          maxTokensField: max_tokens
